<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1929"><link rel="manifest" href="manifest.webmanifest"><title>Desk Assistant</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1929;color:#f4f6fa;font-family:'Segoe UI','Yu Gothic',Meiryo,sans-serif}main{min-height:100vh;display:grid;grid-template-columns:minmax(120px,1fr) minmax(200px,1.55fr) minmax(250px,2.3fr);align-items:center;gap:20px;padding:18px 24px}.date{align-self:stretch;display:flex;flex-direction:column;justify-content:space-around;align-items:center}.monthday{font-size:clamp(38px,5.8vw,90px);font-weight:700;white-space:nowrap;letter-spacing:-.05em}.weekday{font-size:clamp(30px,4.5vw,65px);font-weight:600}.settings{align-self:flex-start;background:transparent;border:0;color:#8da0b5;font-size:26px;cursor:pointer;padding:4px}.clock{width:100%;max-width:390px;aspect-ratio:1;justify-self:center}.schedule{width:100%;align-self:stretch;display:flex;flex-direction:column;justify-content:center}.event{display:grid;grid-template-columns:85px minmax(0,1fr);gap:14px;padding:20px 0;border-bottom:1px solid #41536a;align-items:center;font-size:clamp(13px,1.5vw,21px)}.event:last-child{border-bottom:0}.event time{color:#8fa0b3;font-variant-numeric:tabular-nums}.event.past{opacity:.5}.event.next time{color:#ffbc66}.event .name{overflow-wrap:anywhere}.empty{color:#aebbd0}dialog{border:1px solid #46566d;border-radius:12px;background:#17283c;color:#fff;max-width:min(480px,90vw);padding:24px}dialog::backdrop{background:#0009}input,button{font:inherit}input{width:100%;padding:9px;margin:8px 0 16px;background:#0b1929;border:1px solid #50647b;border-radius:5px;color:white}button.action{background:#c7d6e8;color:#102033;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}.muted{color:#b1c0d1;font-size:13px;line-height:1.6}.status{font-size:12px;color:#afbdce;margin-top:12px}.settingrow{display:flex;gap:12px;justify-content:flex-end} @media(max-width:700px){main{grid-template-columns:100px minmax(120px,1fr);gap:10px;padding:14px}.date{grid-column:1}.clock{grid-column:2;max-width:250px}.schedule{grid-column:1/-1}.event{padding:12px 0}.monthday{font-size:32px}.weekday{font-size:30px}}
</style></head><body><main><section class="date"><div class="monthday" id="date">--/--</div><div class="weekday" id="weekday">--</div><button class="settings" id="settings" aria-label="設定">⚙</button></section><svg class="clock" viewBox="0 0 300 300" aria-label="アナログ時計"><circle cx="150" cy="150" r="145" fill="#ffffff" stroke="#91a1b3" stroke-width="2"/><g id="ticks"></g><g stroke="#0b1929" stroke-linecap="round"><line id="hour" x1="150" y1="160" x2="150" y2="87" stroke-width="9"/><line id="minute" x1="150" y1="165" x2="150" y2="48" stroke-width="5"/></g><line id="second" x1="150" y1="170" x2="150" y2="43" stroke="#bb663e" stroke-width="2.5"/><circle cx="150" cy="150" r="8" fill="#0b1929"/></svg><section class="schedule" id="schedule"><div class="empty">予定を読み込み中…</div></section></main><dialog id="dialog"><h2>設定</h2><label>Microsoft Entra アプリケーション（クライアント）ID<input id="clientId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><p class="muted">Outlookの予定を読み込むには、Microsoft Entraでシングルページアプリを登録し、公開したアプリのURLをリダイレクトURIに登録してください。Microsoft Graph の委任アクセス許可 Calendars.Read が必要です。管理者の承認が必要な場合があります。</p><div class="settingrow"><button class="action" id="save">保存</button><button class="action" id="login">Microsoftに接続</button><button class="action" id="logout">切断</button></div><p class="status" id="status"></p><button class="action" id="close">閉じる</button></dialog><script type="module">
import {PublicClientApplication,InteractionRequiredAuthError} from 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/+esm';
const $=id=>document.getElementById(id), days=['日','月','火','水','木','金','土'];let msal=null,events=[],notified=new Set(),loadedDay='',refreshing=false;
const ticks=$('ticks');for(let i=0;i<12;i++){const a=i*Math.PI/6;const x1=150+125*Math.sin(a),y1=150-125*Math.cos(a),x2=150+135*Math.sin(a),y2=150-135*Math.cos(a);ticks.insertAdjacentHTML('beforeend',`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#253f57" stroke-width="${i%3===0?5:2.3}"/>`)}
function updateClock(){const n=new Date();$('date').textContent=`${n.getMonth()+1}/${n.getDate()}`;$('weekday').textContent=days[n.getDay()];const s=n.getSeconds()+n.getMilliseconds()/1000,m=n.getMinutes()+s/60,h=n.getHours()%12+m/60;for(const [id,deg] of [['hour',h*30],['minute',m*6],['second',s*6]])$(id).setAttribute('transform',`rotate(${deg} 150 150)`);checkNotifications(n)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const now=new Date();const sorted=[...events].filter(e=>!e.isCancelled).sort((a,b)=>new Date(a.start.dateTime)-new Date(b.start.dateTime));$('schedule').innerHTML=sorted.length?sorted.map((e,i)=>{const st=new Date(e.start.dateTime),en=new Date(e.end.dateTime),past=en<=now,next=!past&&!sorted.slice(0,i).some(x=>new Date(x.end.dateTime)>now);const time=e.isAllDay?'終日':st.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:false});return `<div class="event ${past?'past':next?'next':''}"><time>${time}</time><span class="name">${esc(e.subject||'（タイトルなし）')}</span></div>`}).join(''):'<div class="empty">今日の予定はありません</div>'}
function checkNotifications(now){for(const e of events){if(e.isAllDay||e.isCancelled)continue;const t=new Date(e.start.dateTime).getTime(),delta=t-now.getTime(),key=e.id+':'+t;if(delta>=0&&delta<=10*60*1000&&!notified.has(key)){notified.add(key);if('Notification' in window&&Notification.permission==='granted')new Notification('10分以内に予定があります',{body:e.subject||'予定',tag:key})}}}
async function initMsal(){const id=(localStorage.getItem('clientId')||'5b15ab59-0ed0-4dbe-bcee-c7e41eb68fa1');if(!id)return false;msal=new PublicClientApplication({auth:{clientId:id,authority:'https://login.microsoftonline.com/2b206ed9-5389-464c-b575-b140367c42e0',redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});await msal.initialize();const response=await msal.handleRedirectPromise();if(response?.account)msal.setActiveAccount(response.account);else if(msal.getAllAccounts().length)msal.setActiveAccount(msal.getAllAccounts()[0]);return true}
async function token(){const account=msal?.getActiveAccount();if(!account)return null;try{return (await msal.acquireTokenSilent({scopes:['Calendars.Read'],account})).accessToken}catch(e){if(e instanceof InteractionRequiredAuthError)return null;throw e}}
async function refresh(){if(refreshing)return;refreshing=true;try{const t=await token();if(!t){events=[];loadedDay='';$('schedule').innerHTML='<div class="empty">設定からOutlookに接続してください</div>';return}const d=new Date(),start=new Date(d.getFullYear(),d.getMonth(),d.getDate()),end=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);const url=new URL('https://graph.microsoft.com/v1.0/me/calendarView');url.searchParams.set('startDateTime',start.toISOString());url.searchParams.set('endDateTime',end.toISOString());url.searchParams.set('$top','100');url.searchParams.set('$select','id,subject,start,end,isAllDay,isCancelled');const res=await fetch(url,{headers:{Authorization:'Bearer '+t,Prefer:'outlook.timezone="UTC"'}});if(!res.ok)throw Error('Graph API: '+res.status);let data=await res.json(),all=[...data.value];while(data['@odata.nextLink']){data=await(await fetch(data['@odata.nextLink'],{headers:{Authorization:'Bearer '+t,Prefer:'outlook.timezone="UTC"'}})).json();all.push(...data.value)}loadedDay=new Date().toDateString();events=all.map(e=>({...e,start:{dateTime:e.start.dateTime+'Z'},end:{dateTime:e.end.dateTime+'Z'}}));render();$('status').textContent='Outlookと同期しました'}catch(e){events=[];loadedDay='';$('status').textContent=e.message;$('schedule').innerHTML='<div class="empty">予定を取得できませんでした。設定を確認してください。</div>'}finally{refreshing=false}}
$('settings').onclick=()=>{$('clientId').value=(localStorage.getItem('clientId')||'5b15ab59-0ed0-4dbe-bcee-c7e41eb68fa1')||'';$('dialog').showModal()};$('close').onclick=()=>$('dialog').close();$('save').onclick=async()=>{localStorage.setItem('clientId',$('clientId').value.trim());$('status').textContent='保存しました。接続するには「Microsoftに接続」を押してください。';await initMsal()};$('login').onclick=async()=>{try{if(!msal)await initMsal();if(!msal)throw Error('クライアントIDを保存してください');await msal.loginRedirect({scopes:['Calendars.Read'],prompt:'select_account'})}catch(e){$('status').textContent=e.message}};$('logout').onclick=async()=>{events=[];loadedDay='';if(msal?.getActiveAccount())await msal.logoutRedirect();$('schedule').innerHTML='<div class="empty">設定からOutlookに接続してください</div>'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if('Notification'in window&&Notification.permission==='default')$('settings').addEventListener('click',()=>Notification.requestPermission(),{once:true});setInterval(updateClock,100);setInterval(()=>{if(loadedDay&&loadedDay!==new Date().toDateString()){events=[];refresh()}else if(loadedDay)render()},30000);setInterval(refresh,120000);updateClock();try{await initMsal();await refresh()}catch(e){$('schedule').innerHTML='<div class="empty">設定からOutlookに接続してください</div>'}
</script></body></html>
